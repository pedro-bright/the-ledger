name: Check Stale Sources

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch: # Allow manual trigger

jobs:
  check-links:
    name: Check Source Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check links
        id: check
        continue-on-error: true
        run: npm run check-links

      - name: Upload full report
        id: upload
        if: hashFiles('broken-links-report.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-link-report
          path: broken-links-report.md

      - name: Post report summary
        if: steps.check.outcome == 'failure' || hashFiles('broken-links-summary.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().slice(0, 10);
            const summaryPath = 'broken-links-summary.md';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.existsSync(summaryPath)
              ? `${fs.readFileSync(summaryPath, 'utf-8')}\n\nFull report: [broken-links-report.md](${process.env.ARTIFACT_URL})`
              : `## Source Link Check Failed\n\nThe weekly link checker failed before writing a report. See [the workflow run](${runUrl}) for details.`;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
              per_page: 1,
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `### Updated: ${date}\n\n${body}`,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔗 Source link problems detected - ${date}`,
                body,
                labels: ['broken-links', 'maintenance'],
              });
            }
