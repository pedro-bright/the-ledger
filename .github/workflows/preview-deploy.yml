name: Preview Deploy

# workflow_run always uses this file from main, so a pull request cannot edit it
# to read the token. The artifact is pull request output: treat it as data, never
# run anything from it, and never check out the pull request's code here.
on:
  workflow_run:
    workflows: [Preview Build]
    types: [completed]

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    # Fork pull requests get a passing build and no deploy.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: preview-deploy
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Check for preview token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VERCEL_PREVIEW_TOKEN is not available to this run, so no preview was deployed."
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm ci --prefix .github/deploy-tools --ignore-scripts

      - name: Download built site
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site
          path: ${{ runner.temp }}/preview/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Deploy preview to Vercel
        id: deploy
        if: steps.token.outputs.present == 'true'
        working-directory: ${{ runner.temp }}/preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$("$GITHUB_WORKSPACE/.github/deploy-tools/node_modules/.bin/vercel" deploy --yes dist/)
          if [[ -z "$url" || "$url" != https* ]]; then
            echo "Vercel did not return a preview URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed preview: $url"

      - name: Comment preview URL on PR
        if: steps.deploy.outputs.url != '' && github.event.workflow_run.pull_requests[0].number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- preview-deploy-comment -->';
            const body = [
              marker,
              '## Preview deploy',
              `🔍 ${process.env.PREVIEW_URL}`,
              '',
              `Built from \`${process.env.HEAD_SHA.slice(0, 7)}\`. Re-runs on every push to this PR.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
