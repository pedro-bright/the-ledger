name: E2E & Content Parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; each run on main has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build graph and feeds
        run: |
          npm run build-graph
          npm run generate-feed
          mkdir -p site/public
          cp graph.json site/public/
          cp feed.xml rss.xml site/public/ 2>/dev/null || true

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-site
          path: |
            graph.json
            site/dist/
          retention-days: 1
          if-no-files-found: error

      - name: Run content security tests
        run: npm run test:security

      - name: Run content parity check
        run: npm run test:parity

      - name: Run dark-leak check
        run: npm run test:no-dark-leaks

      - name: Run CSS browser floor check
        run: npm run test:css-floor

      - name: Check ISO date years
        run: npm run test:dates

      - name: Run corrections page unit test
        run: npm run test:corrections

      - name: Check preview card images
        run: npm run test:og

      - name: Check the feeds
        run: npm run test:feed

  playwright:
    name: Playwright (${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The security spec runs the root content security suite.
      - name: Install root dependencies
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Read Playwright version
        id: playwright-version
        working-directory: site
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: site
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        working-directory: site
        run: |
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt to install system dependencies failed; retrying in 30 seconds."
              sleep 30
            fi
          done
          echo "Could not install system dependencies after 3 attempts."
          exit 1

      - name: Download built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site

      # In CI the Playwright web server serves this build instead of building again.
      - name: Run Playwright tests
        working-directory: site
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright test-results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: site/test-results/
          retention-days: 14
          if-no-files-found: ignore
