name: Preview Build

# Runs the pull request's code, so it holds no deploy credentials. It also leaves
# out the PostHog variables so previews do not report to production analytics.
# preview-deploy.yml deploys the artifact this workflow uploads.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build PR Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build graph
        run: |
          npm run build-graph
          mkdir -p site/public
          cp graph.json site/public/

      - name: Generate feeds
        run: |
          npm run generate-feed
          mkdir -p site/public
          cp feed.xml rss.xml site/public/ 2>/dev/null || true

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site
          path: site/dist
          retention-days: 1
          if-no-files-found: error
