name: Validate Content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; each run on main has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Schema & Cross-Reference Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Type-check scripts
        run: npm run typecheck

      - name: Type-check site
        run: npm run typecheck:site

      - name: Run validation
        run: npm run validate

      - name: Test YAML parsing
        run: npm run test:yaml

      - name: Test event filenames and scaffold
        run: npm run test:event-files

      - name: Test source checker
        run: npm run test:links

      - name: Test Vercel output and analytics isolation
        run: npm run test:vercel

      - name: Build relationship graph
        run: npm run build-graph

      - name: Upload graph artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relationship-graph
          path: graph.json
          retention-days: 30
